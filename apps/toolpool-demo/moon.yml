$schema: "https://moonrepo.dev/schemas/project.json"
project:
  description: "Runs Toolpool as an MCP server in front of the sample REST service."
language: "java"
layer: "application"
tags: ["java"]
dependsOn:
  - toolpool-spring-boot-starter
  - sample-rest-api-client
tasks:
  run:
    command: "./gradlew"
    args: [":apps:toolpool-demo:bootRun"]
    deps: ["^:build"]
    options:
      runFromWorkspaceRoot: true
      runInCI: skip
