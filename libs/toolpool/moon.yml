$schema: "https://moonrepo.dev/schemas/project.json"
language: "unknown"
layer: "library"
tasks:
  build:
    command: "./gradlew"
    args: [":libs:toolpool:build"]
    options:
      runFromWorkspaceRoot: true
  test:
    command: "./gradlew"
    args: [":libs:toolpool:test", ":libs:toolpool:pmdMain", ":libs:toolpool:pmdTest"]
    options:
      runFromWorkspaceRoot: true
      runInCI: true
  lint:
    script: "find src -name '*.java' -print0 | xargs -0 -r google-java-format --dry-run --set-exit-if-changed && find src -name '*.java' -print0 | xargs -0 -r checkstyle -c config/checkstyle/checkstyle.xml"
    options:
      runInCI: true
  format:
    script: "find src -name '*.java' -print0 | xargs -0 -r google-java-format --replace"
    options:
      runInCI: false
