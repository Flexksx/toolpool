openapi: 3.1.0
info:
  title: YAML
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: User
  description: User management REST endpoints.
paths:
  /users/{id}:
    get:
      tags:
      - User
      summary: Get a user by ID
      description: Retrieves the user's data based on the user id
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: verbose
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRestResponse"
    put:
      tags:
      - User
      summary: Update a user
      description: Updates an existing user's data
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRestRequest"
        required: true
      responses:
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRestResponse"
  /users:
    post:
      tags:
      - User
      summary: Create a user
      description: Creates a new user from the given request payload
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRestRequest"
        required: true
      responses:
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRestResponse"
components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    UpdateUserRestRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    UserRestResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    CreateUserRestRequest:
      type: object
      properties:
        name:
          type: string
